app = 'bitcoiniciantes-market'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3001
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

[mounts]
  source = "market_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
