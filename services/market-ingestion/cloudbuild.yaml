steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/bitcoiniciantes-market'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/bitcoiniciantes-market'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'run'
      - 'deploy'
      - 'bitcoiniciantes-market'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bitcoiniciantes-market'
      - '--region'
      - 'southamerica-east1'
      - '--platform'
      - 'managed'
      - '--port'
      - '3001'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '3'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production'
      - '--session-affinity'

images:
  - 'gcr.io/$PROJECT_ID/bitcoiniciantes-market'
