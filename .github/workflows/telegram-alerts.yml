name: Alertas Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: telegram-alerts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Recuperar estado dos alertas
        uses: actions/cache/restore@v5
        with:
          path: .alert-state
          key: telegram-alert-state-${{ github.run_id }}
          restore-keys: |
            telegram-alert-state-
      - name: Verificar ativos e avisar
        id: monitor
        run: node scripts/monitor-telegram-alerts.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: https://mural-bitcoiniciantes-default-rtdb.firebaseio.com
          TELEGRAM_SETUP_TEST: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Guardar novo estado
        if: steps.monitor.outputs.state_changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: .alert-state
          key: telegram-alert-state-${{ github.run_id }}