name: Mantem agendas ativas

on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-schedules-active
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registrar atividade do repositorio
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/schedule-heartbeat.txt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/schedule-heartbeat.txt
          git commit -m "Mantem agendas ativas"
          git push